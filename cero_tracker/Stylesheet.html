<style>
/*    CERO Tracker Dashboard — Stylesheet
      Theme system: Light (default) ↔ Dark, toggled via data-theme on <html>
*/

/* ── Google Font load ────────────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap');

/*    LIGHT THEME (default)
*/
:root,
[data-theme="light"] {
  --bg:              #f4f7f6;
  --bg-2:            #ffffff;
  --bg-card:         #ffffff;
  --bg-card-hover:   #f8fafc;
  --bg-input:        #f1f5f9;
  --border:          rgba(0,0,0,0.08);
  --border-active:   rgba(70,189,198,0.4);

  --primary:         #46bdc6;
  --primary-light:   #68cfd7;
  --primary-glow:    rgba(70,189,198,0.2);
  --primary-dim:     rgba(70,189,198,0.08);

  --green:           #059669;
  --green-dim:       rgba(5,150,105,0.1);
  --red:             #fd6b56;
  --red-dim:         rgba(253,107,86,0.12);
  --blue:            #2563eb;
  --blue-dim:        rgba(37,99,235,0.1);
  --orange:          #f97316;
  --orange-dim:      rgba(249,115,22,0.12);

  --text-1:          #0f172a;
  --text-2:          #475569;
  --text-3:          #94a3b8;
  --text-4:          #cbd5e1;

  --shadow:          0 4px 24px rgba(0,0,0,0.08);
  --shadow-card:     0 2px 12px rgba(0,0,0,0.06);
  --shadow-sidebar:  2px 0 12px rgba(0,0,0,0.06);
}

/*    DARK THEME
*/
[data-theme="dark"] {
  --bg:              #0f172a;
  --bg-2:            #1e293b;
  --bg-card:         #1e293b;
  --bg-card-hover:   #334155;
  --bg-input:        #0f172a;
  --border:          rgba(255,255,255,0.07);
  --border-active:   rgba(70,189,198,0.5);

  --primary:         #46bdc6;
  --primary-light:   #68cfd7;
  --primary-glow:    rgba(70,189,198,0.25);
  --primary-dim:     rgba(70,189,198,0.12);

  --green:           #10b981;
  --green-dim:       rgba(16,185,129,0.12);
  --red:             #fd6b56;
  --red-dim:         rgba(253,107,86,0.15);
  --blue:            #3b82f6;
  --blue-dim:        rgba(59,130,246,0.12);
  --orange:          #f97316;
  --orange-dim:      rgba(249,115,22,0.15);

  --text-1:          #f8fafc;
  --text-2:          #cbd5e1;
  --text-3:          #64748b;
  --text-4:          #334155;

  --shadow:          0 4px 24px rgba(0,0,0,0.4);
  --shadow-card:     0 2px 12px rgba(0,0,0,0.3);
  --shadow-sidebar:  none;
}

/*    RESET & BASE
*/
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: 'Lexend', sans-serif;
  background-color: var(--bg);
  color: var(--text-1);
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s ease, color 0.3s ease;
  overflow: hidden;
}

h1, h2, h3, p { margin: 0; }
a { text-decoration: none; color: inherit; }
button, input, select, textarea {
  font-family: inherit;
  border: none;
  background: none;
  outline: none;
}

/*    UTILITIES
*/
.mono { font-family: monospace; }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
}
.badge-green  { background: var(--green-dim); color: var(--green); }
.badge-red    { background: var(--red-dim); color: var(--red); }
.badge-orange { background: var(--orange-dim); color: var(--orange); }
.badge-blue   { background: var(--blue-dim); color: var(--blue); }
.badge-gray   { background: var(--bg-input); color: var(--text-2); }
.badge-primary{ background: var(--primary-dim); color: var(--primary); }
.badge-yellow { background: rgba(250,204,21,0.18); color: #b45309; }

.lucide { width: 18px; height: 18px; stroke-width: 2.2; flex-shrink: 0; }

/*    SCROLLBAR
*/
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-4); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/*    LOGIN & SPLASH SCREENS
*/
.login-screen, .splash-screen {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  z-index: 10000;
}
.login-card {
  background: var(--bg-card); padding: 44px; border-radius: 24px;
  box-shadow: var(--shadow); width: 100%; max-width: 420px;
  border: 1px solid var(--border);
}
.login-logo { width: 64px; height: 64px; margin-bottom: 20px; border-radius: 12px; }
.login-card h2 { font-size: 24px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; }
.login-card p { color: var(--text-2); font-size: 14px; margin-bottom: 28px; }

/* Form shared styles */
.form-group { text-align: left; margin-bottom: 18px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
.form-group input, .form-group select, .form-group textarea,
.form-input {
  width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1.5px solid var(--border);
  border-radius: 10px; color: var(--text-1); font-size: 14px; transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
.form-group select, select.form-input {
  appearance: none;
  background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 10px;
  padding-right: 32px;
}
html.dark .form-group select, html.dark select.form-input {
  background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239ca3af%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus,
.form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.form-group input:disabled, .form-group select:disabled, .form-group textarea:disabled { opacity: 0.6; cursor: not-allowed; }
.login-btn {
  width: 100%; padding: 14px; background: var(--primary); color: #fff;
  border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer;
  transition: all 0.2s; display: flex; justify-content: center; align-items: center;
  margin-top: 4px;
}
.login-btn:hover { background: var(--primary-light); transform: translateY(-1px); box-shadow: 0 4px 16px var(--primary-glow); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/*    APP LAYOUT (Sidebar + Main Content)
*/
.app-layout { display: flex; width: 100vw; height: 100vh; }

.sidebar {
  width: 260px; background: var(--bg-2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 100; transition: transform 0.3s ease;
  box-shadow: var(--shadow-sidebar);
}
.sidebar-brand {
  height: 72px; padding: 0 20px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.brand-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.brand-icon img { width: 100%; height: 100%; object-fit: cover; }
.brand-text { display: flex; flex-direction: column; }
.brand-name { font-weight: 700; font-size: 16px; color: var(--text-1); }
.brand-sub  { font-size: 11px; font-weight: 500; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }

.sidebar-nav { flex: 1; padding: 20px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px;
  color: var(--text-2); font-weight: 500; font-size: 14px; cursor: pointer;
  transition: all 0.18s; margin-bottom: 4px;
}
.nav-item:hover { background: var(--bg-input); color: var(--text-1); transform: translateX(2px); }
.nav-item.active { background: var(--primary-dim); color: var(--primary); font-weight: 600; }
.nav-item.active .lucide { color: var(--primary); }

.sidebar-footer { padding: 20px; border-top: 1px solid var(--border); }
.user-profile { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; background: var(--bg-input); }
.user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
.user-info { display: flex; flex-direction: column; overflow: hidden; }
.user-name { font-weight: 600; font-size: 13px; color: var(--text-1); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.user-role { font-size: 11px; color: var(--text-2); text-transform: uppercase; }
.logout-btn { margin-top: 12px; width: 100%; padding: 10px; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); }
.logout-btn:hover { background: var(--red-dim); color: var(--red); border-color: transparent; }

.main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/*    HEADER
*/
.top-header {
  height: 72px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.page-title { font-size: 20px; font-weight: 700; color: var(--text-1); }
.hamburger-btn { display: none; background: none; border: none; color: var(--text-1); cursor: pointer; padding: 4px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; background: var(--bg-input);
  display: flex; align-items: center; justify-content: center; color: var(--text-2);
  cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
}
.icon-btn:hover { background: var(--bg-card-hover); color: var(--primary); border-color: var(--border-active); }
/* Flat icon button — used inside table rows (no circle background) */
.table-icon-btn {
  background: none; border: none; padding: 4px 6px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.15s; vertical-align: middle;
}
.table-icon-btn:hover { background: var(--bg-input); }

/*    PAGE CONTENT
*/
.page-content { flex: 1; overflow-y: auto; padding: 24px; position: relative; }
.page-slot { display: flex; flex-direction: column; gap: 24px; animation: fadeIn 0.3s ease-out; }

/*    DASHBOARD CARDS
*/
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 16px; margin-bottom: 28px; }
.stat-card {
  background: var(--bg-card); border-radius: 16px; padding: 18px 20px;
  border: 1px solid var(--border); display: flex; flex-direction: column;
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card.clickable-stat { cursor: pointer; }
.stat-card.clickable-stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-card); border-color: var(--border-active); }
.stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.stat-title { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.3px; }
.stat-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.stat-value { font-size: 30px; font-weight: 700; color: var(--text-1); line-height: 1; }
.stat-hint { font-size: 11px; color: var(--text-3); margin-top: 6px; }

/* Card colors */
.bg-primary-dim { background: var(--primary-dim); color: var(--primary); }
.bg-green-dim   { background: var(--green-dim); color: var(--green); }
.bg-red-dim     { background: var(--red-dim); color: var(--red); }
.bg-orange-dim  { background: var(--orange-dim); color: var(--orange); }
.bg-blue-dim    { background: var(--blue-dim); color: var(--blue); }
.bg-yellow-dim  { background: rgba(250,204,21,0.15); color: #ca8a04; }

/*    TABS & TABLES
*/
.tabs-header { display: flex; gap: 24px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab-btn {
  padding: 12px 0; font-size: 13px; font-weight: 600; color: var(--text-2);
  background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
}
.tab-btn:hover { color: var(--text-1); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

.tab-pane { display: none; animation: fadeIn 0.25s ease-out; }
.tab-pane.active { display: block; }

.table-card { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
.table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.table-title { font-size: 16px; font-weight: 600; color: var(--text-1); }
.table-actions { display: flex; gap: 8px; }

/* Filter / toolbar bar above tables */
.table-toolbar {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: var(--bg-card);
}
.table-toolbar .form-input {
  padding: 8px 12px; font-size: 13px; border-radius: 8px; height: 36px;
}
.search-input-wrap { position: relative; display: flex; align-items: center; }
.search-input-wrap .form-input { padding-left: 34px; }
.search-input-wrap .search-icon { position: absolute; left: 10px; color: var(--text-3); pointer-events: none; }
.row-count-chip {
  margin-left: auto; background: var(--bg-input); color: var(--text-2);
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
  white-space: nowrap;
}

.btn {
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary   { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-light); box-shadow: 0 2px 12px var(--primary-glow); }
.btn-secondary { background: var(--bg-input); color: var(--text-1); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-active); }
.btn-danger    { background: var(--red-dim); color: var(--red); }
.btn-danger:hover { background: rgba(253,107,86,0.2); }
.btn:disabled  { opacity: 0.55; cursor: not-allowed; }

.table-wrap { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.table-wrap::-webkit-scrollbar { display: none; }
.data-table { width: 100%; border-collapse: collapse; text-align: left; }
.data-table th {
  padding: 11px 16px; font-size: 11px; font-weight: 600; color: var(--text-2);
  text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border);
  background: var(--bg-input); white-space: nowrap;
}
.data-table td {
  padding: 14px 16px; font-size: 13px; color: var(--text-1);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
.data-table tbody tr { transition: background 0.15s; }
.data-table tbody tr:hover { background: var(--bg-card-hover); }
.data-table tbody tr.clickable { cursor: pointer; }
.data-table tbody tr.clickable:hover { background: var(--primary-dim); }
.data-table tbody tr:last-child td { border-bottom: none; }

/* Table alignments for Cubs & Families */
#cubs-table th, #cubs-table td,
#families-table th, #families-table td {
  text-align: center;
}
#cubs-table th:first-child, #cubs-table td:first-child,
#families-table th:first-child, #families-table td:first-child {
  text-align: left;
}

/* Search highlight */
.search-highlight { background: rgba(70,189,198,0.25); border-radius: 2px; }

/* Empty state */
.empty-state { padding: 48px 20px; text-align: center; color: var(--text-3); }
.empty-state .lucide { width: 40px; height: 40px; margin-bottom: 12px; color: var(--text-4); opacity: 0.5; }
.empty-state p { font-size: 14px; margin-top: 4px; }

/*    DRAWERS (Modals)
*/
.drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9999;
  backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.drawer-overlay.active { opacity: 1; pointer-events: auto; }

.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 99;
  backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.sidebar-overlay.active { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: 0; width: 100%; max-width: 520px; height: 100vh;
  background: var(--bg-2); z-index: 10000; 
  transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
  display: flex; flex-direction: column;
}
.drawer.active { transform: translateX(0); box-shadow: -8px 0 32px rgba(0,0,0,0.12); }
.drawer-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.drawer-title { font-size: 17px; font-weight: 700; color: var(--text-1); }
.drawer-close { background: none; border: none; color: var(--text-2); cursor: pointer; padding: 6px; border-radius: 50%; transition: background 0.2s; }
.drawer-close:hover { background: var(--bg-input); color: var(--text-1); }
.drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
.drawer-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; flex-shrink: 0; }

/* Drill-down stat drawer (smaller, left-side slide) */
.stat-drawer {
  position: fixed; top: 0; left: 0; width: 100%; max-width: 420px; height: 100vh;
  background: var(--bg-2); z-index: 10002; 
  transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
  display: flex; flex-direction: column;
}
.stat-drawer.active { transform: translateX(0); box-shadow: 8px 0 32px rgba(0,0,0,0.12); }
.stat-drawer-overlay { z-index: 10001; }

/* Profile Drawer Styles */
.profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.profile-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; }
.profile-avatar.cub-avatar { background: var(--orange); }
.profile-name { font-size: 18px; font-weight: 700; color: var(--text-1); }
.profile-sub  { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.profile-field { padding: 10px 12px; background: var(--bg-input); border-radius: 10px; }
.profile-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-3); margin-bottom: 3px; }
.profile-value { font-size: 13px; font-weight: 600; color: var(--text-1); word-break: break-all; }
.section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-2); margin: 18px 0 10px; }
.cub-mini-card { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-input); border-radius: 10px; margin-bottom: 7px; cursor: pointer; transition: all 0.2s; }
.cub-mini-card:hover { background: var(--primary-dim); transform: translateX(2px); }
.cub-mini-name { font-weight: 600; font-size: 13px; color: var(--text-1); }
.cub-mini-sub  { font-size: 11px; color: var(--text-2); margin-top: 2px; }

/* ── Redesigned Drawer Layout ─────────────────────── */
/* Hero area: name + badges */
.drawer-hero { padding: 0 0 18px 0; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
