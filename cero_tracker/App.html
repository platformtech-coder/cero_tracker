<script>

  /**
  
   * @file App.html
  
   * @description Client-side logic for CERO Tracker Web App.
  
   */



  // ═══════════════════════════════════════════════════════════════

  // GLOBAL STATE

  // ═══════════════════════════════════════════════════════════════

  let session = null;

  let dashboardData = null;

  let formDropdowns = null;

  let actionList = [];

  let interactionsList = [];

  let myInteractionsList = [];   // interactions where cub is owned by this rep

  let guestInteractionsList = []; // deprecated, removed later

  let familiesList = [];

  let cubsList = [];
  let globalMasterSearchIndex = []; // Fast client-side search index

  let coverActionsList = [];      // all reps' pending actions (Cover page)

  let handoverNotesList = [];

  let currentAdminRepFilter = 'All Reps';

  let _currentIntTab = 'my'; // track which interactions tab is active



  const PAGE_SIZE = 50;

  // Sequence counter for loadData() — prevents stale responses from a rapid
  // admin-filter change from overwriting the state set by the latest request.
  let _loadDataSeq = 0;

  let paginationState = {

    'dashboard-actions': { page: 1, maxPage: 1, list: null, renderFn: null },

    'actions': { page: 1, maxPage: 1, list: null, renderFn: null },

    'interactions': { page: 1, maxPage: 1, list: null, renderFn: null },

    'cubs': { page: 1, maxPage: 1, list: null, renderFn: null },

    'families': { page: 1, maxPage: 1, list: null, renderFn: null },

    'shift-actions': { page: 1, maxPage: 1, list: null, renderFn: null },

    'handover': { page: 1, maxPage: 1, list: null, renderFn: null },

    'ori-pending': { page: 1, maxPage: 1, list: null, renderFn: null },
    'ori-master': { page: 1, maxPage: 1, list: null, renderFn: null },
    'ori-sessions': { page: 1, maxPage: 1, list: null, renderFn: null },
    'rc-pending': { page: 1, maxPage: 1, list: null, renderFn: null },
    'rc-roster': { page: 1, maxPage: 1, list: null, renderFn: null },
  };



  // ═══════════════════════════════════════════════════════════════

  // RETRY WRAPPER FOR LOCK CONTENTION

  // ═══════════════════════════════════════════════════════════════

  /**
  
   * Wraps a google.script.run call with automatic retry on lock contention.
  
   * With 5 concurrent reps, writes may be serialized by the script lock;
  
   * this retries with exponential backoff instead of failing the user's action.
  
   * @param {Function} fn - ctx => fn(ctx), where ctx is a configured google.script.run
  
   * @param {number} maxRetries
  
   * @param {number} baseDelay
  
   * @returns {Promise<*>}
  
   */

  function scriptRunWithRetry(fn, maxRetries = 3, baseDelay = 1000) {

    return new Promise((resolve, reject) => {

      function attempt(retryCount) {

        let settled = false;

        const ctx = google.script.run

          .withSuccessHandler(res => {

            if (settled) return;

            settled = true;

            resolve(res);

          })

          .withFailureHandler(err => {

            if (settled) return;

            settled = true;

            const msg = (err && err.message) ? err.message : '';

            const isLockError = msg.toLowerCase().includes('currently saving') ||

              msg.toLowerCase().includes('could not obtain lock') ||

              msg.toLowerCase().includes('lock');



            if (retryCount < maxRetries && isLockError) {

              const delay = baseDelay * Math.pow(2, retryCount);

              showToast('info', `Another user is saving. Retrying in ${Math.round(delay / 1000)}s...`);

              setTimeout(() => attempt(retryCount + 1), delay);

            } else {

              reject(err);

            }

          });

        fn(ctx);

      }

      attempt(0);

    });

  }



  function changePage(tableId, delta) {

    const state = paginationState[tableId];

    if (!state || !state.renderFn) return;

    const newPage = state.page + delta;

    if (newPage >= 1 && newPage <= state.maxPage) {

      state.page = newPage;

      _applyPagination(tableId, state);

    }

  }



  function paginateAndRender(tableId, fullList, renderFn) {

    const state = paginationState[tableId];

    state.list = fullList;

    state.renderFn = renderFn;

    state.page = 1;

    _applyPagination(tableId, state);

  }



  function _applyPagination(tableId, state) {

    state.maxPage = Math.max(1, Math.ceil(state.list.length / PAGE_SIZE));

    if (state.page > state.maxPage) state.page = state.maxPage;



    const wrapper = document.getElementById(tableId + '-pagination');

    if (wrapper) {

      if (state.maxPage <= 1) {

        wrapper.style.display = 'none';

      } else {

        wrapper.style.display = 'flex';

        document.getElementById(tableId + '-page-info').textContent = `Page ${state.page} of ${state.maxPage}`;

        const btns = wrapper.querySelectorAll('button');

        if (btns.length >= 2) {

          btns[0].disabled = (state.page === 1);

          btns[1].disabled = (state.page === state.maxPage);

          btns[0].style.opacity = state.page === 1 ? '0.5' : '1';

          btns[1].style.opacity = state.page === state.maxPage ? '0.5' : '1';

        }

      }

    }



    const start = (state.page - 1) * PAGE_SIZE;

    const pageData = state.list.slice(start, start + PAGE_SIZE);

    state.renderFn(pageData);

  }



  // ═══════════════════════════════════════════════════════════════

  // INITIALIZATION

  // ═══════════════════════════════════════════════════════════════

  document.addEventListener('DOMContentLoaded', () => {

    lucide.createIcons();



    // Theme check

    const savedTheme = localStorage.getItem('cero_theme') || 'light';

    document.documentElement.setAttribute('data-theme', savedTheme);

    updateThemeIcon(savedTheme);



    // Check auth
    const token = sessionStorage.getItem('cero_token');
    if (token) {
      session = {
        token: token,
        email: sessionStorage.getItem('cero_email'),
        name: sessionStorage.getItem('cero_name') || 'User',
        role: sessionStorage.getItem('cero_role') || 'Rep'
      };
      showApp();
    } else {
      showLogin();
    }

    // ════════════════════════════════════════════════════════════════
    // DIAGNOSTIC: Verify all drawer elements exist in DOM
    // If missing (due to template truncation), create them dynamically
    // ═══════════════════════════════════════════════════════════════
    (function ensureDrawersExist() {
      const requiredDrawers = {
        'pending-drawer': ['pending-drawer', 'pending-drawer-overlay', 'pending-drawer-type', 'pending-drawer-id', 'pending-drawer-session', 'pending-drawer-result', 'btn-pending-accept', 'pending-drawer-cubid', 'pending-drawer-title'],
        'ori-journey-drawer': ['ori-journey-drawer', 'ori-journey-drawer-overlay', 'ori-journey-cub-id', 'ori-journey-drawer-name', 'ori-journey-drawer-sub', 'ori-journey-info-strip', 'ori-journey-stage-bar', 'ori-journey-blocks', 'ori-journey-save-status', 'btn-ori-journey-save'],
        'rc-attendance-drawer': ['rc-attendance-drawer', 'rc-attendance-drawer-overlay', 'rc-attendance-session', 'rc-attendance-date', 'rc-attendance-list', 'btn-save-rc-attendance'],
        'rc-change-session-drawer': ['rc-change-session-drawer', 'rc-change-session-drawer-overlay', 'rc-change-cubid', 'rc-change-result', 'btn-save-rc-change'],
        'interaction-drawer': ['interaction-drawer', 'drawer-overlay', 'drawer-title', 'fi-is-followup', 'fi-interaction-id', 'fi-cub-id', 'fi-cub-fname', 'fi-cub-lname', 'fi-parent-fname', 'fi-parent-lname', 'fi-handled-by', 'fi-type', 'fi-purpose', 'fi-status', 'fi-feedback', 'fi-action-required', 'fi-action-desc', 'fi-action-deadline', 'fi-search', 'fi-search-results', 'cub-history-preview', 'cub-history-tbody', 'fg-complete-status', 'new-action-container'],
        'family-drawer': ['family-drawer', 'family-drawer-overlay'],
        'cub-drawer': ['cub-drawer', 'cub-drawer-overlay'],
        'handover-drawer': ['handover-drawer', 'handover-drawer-overlay'],
        'stat-drawer': ['stat-drawer', 'stat-drawer-overlay'],
        'confirm-modal': ['confirm-modal', 'confirm-modal-overlay'],
        'user-modal': ['user-modal-overlay'],
        'rc-change-session-drawer': ['rc-change-session-drawer', 'rc-change-session-drawer-overlay'],
      };

      let createdCount = 0;
      const missingElements = [];
      const drawersNeedingRecreation = new Set();

      // Critical elements that, if missing, should trigger full drawer recreation
      const criticalElements = {
        'pending-drawer': ['pending-drawer-type', 'pending-drawer-id', 'pending-drawer-session', 'pending-drawer-result', 'btn-pending-accept', 'pending-drawer-cubid'],
        'ori-journey-drawer': ['ori-journey-cub-id', 'ori-journey-drawer-name', 'ori-journey-blocks', 'btn-ori-journey-save'],
        'interaction-drawer': ['fi-action-deadline', 'fi-interaction-id', 'fi-cub-id', 'fi-search', 'fi-search-results'],
        'ori-journey-drawer': ['ori-journey-cub-id', 'ori-journey-drawer-name', 'ori-journey-blocks', 'btn-ori-journey-save'],
        'rc-attendance-drawer': ['rc-attendance-session', 'rc-attendance-date', 'rc-attendance-list', 'btn-save-rc-attendance'],
        'rc-change-session-drawer': ['rc-change-cubid', 'rc-change-result', 'btn-save-rc-change'],
        'handover-drawer': ['hn-id', 'hn-summary', 'hn-pending', 'hn-btn-save'],
        'user-modal': ['user-modal-title', 'user-modal-name', 'user-modal-email', 'user-modal-password', 'btn-save-user'],
      };

      for (const [drawerId, elementIds] of Object.entries(requiredDrawers)) {
        const drawer = document.getElementById(drawerId);
        if (!drawer) {
          missingElements.push('Drawer root: #' + drawerId);
          drawersNeedingRecreation.add(drawerId);
          continue;
        }
        let hasCriticalMissing = false;
        for (const elId of elementIds) {
          if (!document.getElementById(elId)) {
            missingElements.push('#' + elId + ' (in ' + drawerId + ')');
            // Check if this is a critical element
            if (criticalElements[drawerId] && criticalElements[drawerId].includes(elId)) {
              hasCriticalMissing = true;
            }
          }
        }
        if (hasCriticalMissing) {
          drawersNeedingRecreation.add(drawerId);
        }
      }

      if (missingElements.length > 0) {
        console.warn('[DRAWER DIAGNOSTIC] Missing drawer elements:', missingElements);
        // Add drawers needing recreation to missingElements for createMissingDrawers
        drawersNeedingRecreation.forEach(d => {
          if (!missingElements.some(m => m.includes('in ' + d) || m === 'Drawer root: #' + d)) {
            missingElements.push('Drawer root: #' + d); // Force recreation
          }
        });
        createMissingDrawers(missingElements);
        createdCount = missingElements.length;
      }

      if (createdCount > 0) {
        console.log('[DRAWER DIAGNOSTIC] Dynamically created ' + createdCount + ' missing drawer elements.');
      } else {
        console.log('[DRAWER DIAGNOSTIC] All drawer elements present in DOM.');
      }
    })();

  });



  // ═══════════════════════════════════════════════════════════════

  // THEME

  // ═══════════════════════════════════════════════════════════════

  function toggleTheme() {

    const current = document.documentElement.getAttribute('data-theme');

    const next = current === 'light' ? 'dark' : 'light';

    document.documentElement.setAttribute('data-theme', next);

    localStorage.setItem('cero_theme', next);

    updateThemeIcon(next);

  }



  function updateThemeIcon(theme) {

    const icon = document.getElementById('theme-icon');

    if (theme === 'dark') {
      icon.setAttribute('data-lucide', 'sun');
    } else {
      icon.setAttribute('data-lucide', 'moon');
    }
    lucide.createIcons({ nodes: [icon.parentNode] });
  }



  // ═══════════════════════════════════════════════════════════════

  // AUTHENTICATION

  // ═══════════════════════════════════════════════════════════════

  function handleApiError(err) {

    if (err && err.message && (err.message.toLowerCase().includes('session expired') || err.message.toLowerCase().includes('not found'))) {

      showToast('error', 'Session expired. Please log in again.');

      sessionStorage.clear();

      session = null;

      showLogin();

    } else {

      showToast('error', err && err.message ? err.message : 'An error occurred.');

    }

  }



  function showLogin() {

    document.getElementById('app').style.display = 'none';

    document.getElementById('login-screen').style.display = 'flex';

  }



  function showApp() {

    document.getElementById('login-screen').style.display = 'none';

    document.getElementById('app').style.display = 'flex';



    // Populate user profile in sidebar

    document.getElementById('user-name').textContent = session.name;

    document.getElementById('user-role').textContent = session.role;

    document.getElementById('user-initial').textContent = session.name.charAt(0).toUpperCase();

    const navSettings = document.getElementById('nav-settings');
    if (navSettings) {
      navSettings.style.display = session.role === 'Admin' ? 'flex' : 'none';
    }



    initRouter();

    loadData();
    startBackgroundSync();

    loadFormInitData();

    loadCoverActions();

    loadHandoverNotes();

  }



  function handleLogin(e) {

    e.preventDefault();

    const email = document.getElementById('login-email').value.trim();

    const pass = document.getElementById('login-password').value.trim();

    const btn = document.getElementById('login-btn');

    const btnText = document.getElementById('login-btn-text');



    btn.disabled = true;

    btnText.textContent = 'Authenticating...';



    google.script.run

      .withSuccessHandler(resStr => {

        btn.disabled = false;

        btnText.textContent = 'Log In';

        try {

          const res = JSON.parse(resStr);

          if (res.success) {

            sessionStorage.setItem('cero_token', res.token);

            sessionStorage.setItem('cero_email', res.email);

            sessionStorage.setItem('cero_name', res.name);

            sessionStorage.setItem('cero_role', res.role);

            session = res;

            showToast('success', 'Welcome, ' + res.name);

            showApp();

          } else {

            showToast('error', res.error);

          }

        } catch (err) {

          showToast('error', 'Login error.');

        }

      })

      .withFailureHandler(err => {

        btn.disabled = false;

        btnText.textContent = 'Log In';

        showToast('error', err.message);

      })

      .login(email, pass);

  }



  function togglePasswordVisibility() {

    const input = document.getElementById('login-password');

    const eye = document.getElementById('login-password-eye');

    if (input.type === 'password') {
      input.type = 'text';
      eye.setAttribute('data-lucide', 'eye-off');
    } else {
      input.type = 'password';
      eye.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons({ nodes: [eye.parentNode] });
  }



  function verifySession(token) {

    google.script.run

      .withSuccessHandler(resStr => {

        try {

          const res = JSON.parse(resStr);

          if (res.valid) {

            session = res;

            showApp();

          } else {

            sessionStorage.clear();

            session = null;

            showLogin();

          }

        } catch (e) {

          sessionStorage.clear();

          session = null;

          showLogin();

        }

      })

      .withFailureHandler(() => {

        sessionStorage.clear();

        session = null;

        showLogin();

      })

      .validateSession(token);

  }



  function handleLogout() {

    const token = sessionStorage.getItem('cero_token');

    if (token) {

      google.script.run.logout(token);

    }

    sessionStorage.clear();

    session = null;

    currentAdminRepFilter = 'All Reps';

    showLogin();

  }



  function handleAdminFilterChange() {

    const select = document.getElementById('admin-rep-filter');

    if (select) {

      currentAdminRepFilter = select.value;

      loadData();

    }

  }



  function populateAdminFilter(reps) {

    if (session.role !== 'Admin') return;

    const container = document.getElementById('admin-filter-container');

    const select = document.getElementById('admin-rep-filter');

    if (!container || !select) return;



    container.style.display = 'flex';

    const currentVal = select.value || 'All Reps';



    let html = `<option value="All Reps">All Reps</option>`;

    reps.forEach(r => {

      html += `<option value="${r}">${r}</option>`;

    });

    select.innerHTML = html;

    select.value = currentVal;

  }



  // ═══════════════════════════════════════════════════════════════

  // ROUTER & SIDEBAR

  // ═══════════════════════════════════════════════════════════════

  function initRouter() {

    window.addEventListener('hashchange', handleRoute);

    if (!window.location.hash) {

      window.location.hash = '#/dashboard';

    } else {

      handleRoute();

    }

  }



  function handleRoute() {

    const hash = window.location.hash || '#/dashboard';

    const page = hash.replace('#/', '');



    // Hide all pages

    document.querySelectorAll('.page-slot').forEach(el => el.style.display = 'none');



    // Show target page

    const targetEl = document.getElementById('page-' + page);

    if (targetEl) {

      targetEl.style.display = 'block';

    } else {

      document.getElementById('page-dashboard').style.display = 'block';

    }



    // Update nav active state

    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

    const activeNav = document.querySelector(`.nav-item[data-page="${page}"]`);

    if (activeNav) activeNav.classList.add('active');



    // Update Header Title

    const titleMap = {

      'dashboard': 'Dashboard',

      'engagements': 'Engagements',

      'directory': 'Directory',

      'orientation': 'Orientation',

      'reading-circle': 'Reading Circle',

      'shift-actions': 'Shift Actions',

      'handover': 'Handover Notes',

      'settings': 'System Settings'

    };

    document.getElementById('page-title').textContent = titleMap[page] || 'Dashboard';



    // Mobile sidebar close on navigation

    if (window.innerWidth <= 768) {

      document.getElementById('sidebar').classList.remove('mobile-open');

      document.getElementById('sidebar-overlay').classList.remove('active');

    }

    if (page === 'settings') {
      loadSettings();
    }
    if (page === 'orientation') {
      loadOrientationPage();
    }
    if (page === 'reading-circle') {
      loadReadingCirclePage();
    }
  }



  function switchTab(pageId, targetTabId) {

    // Hide all panes on this page

    const page = document.getElementById('page-' + pageId);

    page.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));

    page.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));



    // Show target

    document.getElementById(targetTabId).classList.add('active');

    event.currentTarget.classList.add('active');

  }



  function toggleSidebar() {

    document.getElementById('sidebar').classList.toggle('mobile-open');

    document.getElementById('sidebar-overlay').classList.toggle('active');

  }



  // ═══════════════════════════════════════════════════════════════

  // DATA LOADING

  // ═══════════════════════════════════════════════════════════════

  function loadData() {

    const splash = document.getElementById('splash-screen');

    splash.style.display = 'flex';

    // Capture the sequence ID for this specific call. If a newer call fires before
    // this response arrives, _loadDataSeq will be higher and we discard this result.
    const mySeq = ++_loadDataSeq;



    google.script.run

      .withSuccessHandler(resStr => {

        // Discard if a newer loadData() call has already superseded this one
        if (mySeq !== _loadDataSeq) return;

        splash.style.display = 'none';

        try {

          const res = JSON.parse(resStr);

          if (res.success) {

            dashboardData = res.stats;

            actionList = res.actions || [];

            interactionsList = res.interactions || [];



            familiesList = res.families || [];

            cubsList = res.cubs || [];
            if (res.readingCircleList) {
              const rcMap = new Map();
              res.readingCircleList.forEach(rc => rcMap.set(String(rc.cubId).toLowerCase(), rc));
              cubsList.forEach(c => {
                const cId = String(c.cubId).toLowerCase();
                if (rcMap.has(cId)) c.readingCircle = rcMap.get(cId);
              });
            }
            window.CUBS = cubsList;

            // Populate client-side CONFIG from server constants so RC drawers work
            if (res.constants) {
              window.CONFIG = window.CONFIG || {};
              if (res.constants.rcSessions) window.CONFIG.rcSessions = res.constants.rcSessions;
              if (res.constants.orientationSessions) window.CONFIG.orientationSessions = res.constants.orientationSessions;
              if (res.constants.stageBlocks) window.CONFIG.stageBlocks = res.constants.stageBlocks;
            }

            if (res.reps) {

              populateAdminFilter(res.reps);

            }



            renderDashboard();

            renderActionsTable();

            renderFamiliesTable();

            renderCubsTable();

            // Fetch the global master search index asynchronously in the background.
            // Guard with a local capture of mySeq so a stale index doesn't overwrite
            // one that was already loaded by a newer loadData() call.
            const seqAtFetch = mySeq;
            google.script.run
              .withSuccessHandler(idxStr => {
                if (seqAtFetch !== _loadDataSeq) return; // discard if superseded
                try {
                  globalMasterSearchIndex = JSON.parse(idxStr);
                } catch (e) { }
              })
              .getMasterSearchIndex(session.token);




            // Re-apply filters for interactions to populate the table correctly

            filterInteractions();



          } else {

            showToast('error', res.error);

          }

        } catch (err) {

          console.error(err); showToast('error', 'Dash Err: ' + err.message);

        }

      })

      .withFailureHandler(err => {

        if (mySeq !== _loadDataSeq) return; // discard stale failure too

        splash.style.display = 'none';

        handleApiError(err);

      })

      .getDashboardData(session.token, currentAdminRepFilter);

  }



  function refreshData() {

    // Clear all filter inputs so UI matches the fresh, un-filtered data rendered by loadData

    [

      'dash-action-primary-filter', 'dash-action-secondary-filter',

      'cub-search', 'cub-primary-filter', 'cub-secondary-filter',

      'int-search', 'int-primary-filter', 'int-secondary-filter',

      'fam-search',

      'cover-search', 'cover-filter-rep', 'cover-primary-filter', 'cover-secondary-filter',

      'hn-search', 'hn-filter-rep',

    ].forEach(id => {

      // Hide secondary dropdowns on reset

      if (['dash-action-secondary-filter', 'cover-secondary-filter', 'cub-secondary-filter', 'int-secondary-filter'].includes(id)) {

        const el = document.getElementById(id);

        if (el) { el.value = ''; el.style.display = 'none'; }

        return;

      }

      const el = document.getElementById(id);

      if (el) el.value = '';

    });

    loadData();

    loadCoverActions();

    loadHandoverNotes();

  }



  function loadFormInitData() {

    google.script.run

      .withSuccessHandler(resStr => {

        try {

          const res = JSON.parse(resStr);

          if (res.success) {

            formDropdowns = res.dropdowns; if(formDropdowns.orientationStages) formDropdowns.orientationStages = formDropdowns.orientationStages.filter(s => s.toLowerCase() !== 'invited');

            populateDropdowns();

          }

        } catch (e) { }

      })

      .getFormInitData(session.token);

  }



  // ═══════════════════════════════════════════════════════════════

  // RENDERING

  // ═══════════════════════════════════════════════════════════════

  function renderDashboard() {

    if (!dashboardData) return;

    document.getElementById('stat-families').textContent = dashboardData.totalParents;

    document.getElementById('stat-cubs').textContent = dashboardData.totalCubs;

    document.getElementById('stat-active-subs').textContent = dashboardData.activeSubs;

    document.getElementById('stat-expired-subs').textContent = dashboardData.expiredSubs;

    document.getElementById('stat-exp-week').textContent = dashboardData.almostExpiringWeek;

    document.getElementById('stat-exp-month').textContent = dashboardData.almostExpiringMonth;

    document.getElementById('stat-flagged').textContent = dashboardData.flaggedCubs;

    document.getElementById('stat-pending').textContent = dashboardData.pendingActionsCount;


    // Scorecards
    if (document.getElementById('scorecard-onboarding-count')) {
      const onboarded = dashboardData.cubs ? dashboardData.cubs.filter(c => {
        const d = new Date(c.dateOnboarded);
        return (Date.now() - d.getTime()) <= 7 * 24 * 60 * 60 * 1000;
      }).length : 0;
      document.getElementById('scorecard-onboarding-count').textContent = onboarded;
      
      const repCount = dashboardData.reps ? dashboardData.reps.length : 1;
      const rate = repCount > 0 ? (onboarded / repCount).toFixed(1) : onboarded;
      if (document.getElementById('scorecard-onboarding-rate')) {
        document.getElementById('scorecard-onboarding-rate').textContent = rate;
      }
    }

    if (document.getElementById('scorecard-retention-rate')) {
      const active = parseInt(dashboardData.activeSubs) || 0;

        if (secondary === 'active') return actSub === 'active';

        if (secondary === 'expired') return actSub === 'expired';

        if (secondary === 'almost-expiring') return actSub.includes('expiring');

        return true;

      }

      if (primary === 'flag') {

        return act.flag === secondary;

      }

      if (primary === 'status') {

        const actStat = (act.actionStatus || '').toLowerCase();

        if (secondary === 'overdue') return act.isOverdue;

        if (secondary === 'pending') return actStat === 'pending';

        if (secondary === 'booked') return actStat === 'booked';

  const _COVER_ACTION_FILTER_OPTIONS = {

    'ori-stage': () => {

      const stages = formDropdowns?.orientationStages || [];

      return [{ value: '', label: 'All Ori. Stages' }, ...stages.map(s => ({ value: s.toLowerCase(), label: s }))];

    },

    'sub-status': () => [

      { value: '', label: 'All Sub Status' },

      { value: 'active', label: 'Active' },

      { value: 'almost-expiring', label: 'Almost Expiring' },

      { value: 'expired', label: 'Expired' },

    ],

    'flag': () => [

      { value: '', label: 'All Flags' },

      { value: '5-Day Break', label: '5-Day Break' },

      { value: '10-Day Break', label: '10-Day Break' },

    ],

    'status': () => [

      { value: '', label: 'All Action Statuses' },

      { value: 'overdue', label: 'Overdue Only' },

      { value: 'pending', label: 'Pending' },

      { value: 'booked', label: 'Booked' },

      { value: 'in progress', label: 'In Progress' },

      { value: 'completed', label: 'Completed' },

    ],

  };



  function updateCoverActionSecondaryFilter() {

    const primary = document.getElementById('cover-primary-filter').value;

    const secondary = document.getElementById('cover-secondary-filter');

    if (!primary) {

      secondary.style.display = 'none';

      secondary.innerHTML = '';

      filterCoverActions();

      return;

    }

    const opts = _COVER_ACTION_FILTER_OPTIONS[primary]?.() || [];

    secondary.innerHTML = opts.map(o => `<option value="${o.value}">${o.label}</option>`).join('');

    secondary.style.display = '';

    filterCoverActions();

  }



  function filterCoverActions() {

    const q = (document.getElementById('cover-search')?.value || '').toLowerCase();

    const rep = (document.getElementById('cover-filter-rep')?.value || '').toLowerCase();

    const primary = (document.getElementById('cover-primary-filter')?.value || '');

    const secondary = (document.getElementById('cover-secondary-filter')?.value || '');



    const filtered = coverActionsList.filter(act => {

      const text = `${act.cubFirstName} ${act.cubLastName} ${act.parentFirstName} ${act.parentLastName} ${act.action}`.toLowerCase();

      const actSubStatusLc = (act.subStatus || '').toLowerCase();

      const actOriStageLc = (act.orientationStage || '').toLowerCase();

      const actFlagLc = (act.flag || '').toLowerCase();

      const actStatusLc = (act.actionStatus || '').toLowerCase();



      if (q && !text.includes(q)) return false;

      if (rep && (act.relationshipOwner || '').toLowerCase() !== rep) return false;



      if (primary && secondary) {

        if (primary === 'ori-stage') {

          if (actOriStageLc !== secondary) return false;

        } else if (primary === 'sub-status') {

          if (secondary === 'active' && actSubStatusLc !== 'active') return false;

          if (secondary === 'expired' && actSubStatusLc !== 'expired') return false;

          if (secondary === 'almost-expiring' && !actSubStatusLc.includes('expiring')) return false;

        } else if (primary === 'flag') {

          if (!actFlagLc.includes(secondary.toLowerCase())) return false;

        } else if (primary === 'status') {

          if (secondary === 'overdue' && !act.isOverdue) return false;

          if (secondary === 'pending' && actStatusLc !== 'pending') return false;

          if (secondary === 'booked' && actStatusLc !== 'booked') return false;

          if (secondary === 'in progress' && actStatusLc !== 'in progress') return false;

          if (secondary === 'completed' && actStatusLc !== 'completed') return false;

        }

      }



      return true;

    });



    renderCoverActionsTable(filtered);

  }

  document.getElementById('fi-search').addEventListener('input', (e) => {

      const renderResults = (results, isServerResults) => {

          if (isServerResults) {

            resDiv.innerHTML = '<div class="search-result-item" style="color:var(--text-3); cursor:default;">No results found</div>';

        resDiv.innerHTML = '';

          item.className = 'search-result-item';

          // Show rep tag if this cub is owned by a different rep

          const repName = r.repName || r.handledBy || r.rep || '';

          const isOwn = !repName || (session && repName.toLowerCase() === session.name.toLowerCase()) || r.isOwnContact === true;

          const repTag = (!isOwn && repName) ? `<span class="rep-tag">${repName}</span>` : '';

        `;

          item.addEventListener('click', () => selectSearchResult(r));

          resDiv.appendChild(item);

        });

      };



      // Step 1 — instant local results from own-cubs list (fast-path, may be partial)

      const localMatches = cubsList.filter(c => {

        const text = `${c.cubFirstName} ${c.cubLastName} ${c.parentFirstName} ${c.parentLastName}`.toLowerCase();

        return text.includes(lowerQ);

      if (localMatches.length > 0) {

        renderResults(localMatches, false);

      } else {

        resDiv.innerHTML = '<div class="search-result-item" style="color:var(--text-3); cursor:default;">Searching master directory...</div>';

      }



      // Step 2 — always fire server search across ALL cubs (searchAll=true for every role)

      // This replaces the local results with the authoritative full-directory response

      google.script.run

        .withSuccessHandler(resultsStr => {

          try {

            renderResults(JSON.parse(resultsStr), true);

          } catch (err) {

            resDiv.innerHTML = '<div class="search-result-item" style="color:var(--red);">Error formatting results</div>';

          }

        .withFailureHandler(() => {

        .searchContacts(session.token, query, true); // true = always search full master

  /**
  
   * Formats current time for optimistic display.
  
   * Returns a display string like "Mon, 15-Sep-26 - 03:45pm"
  
   */

  function _nowDisplayStr() {

    const now = new Date();

    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const d = days[now.getDay()];

    const dd = String(now.getDate()).padStart(2, '0');

    const m = months[now.getMonth()];

    const yy = String(now.getFullYear()).slice(2);

    let h = now.getHours();

    const min = String(now.getMinutes()).padStart(2, '0');

    const ampm = h >= 12 ? 'pm' : 'am';

    h = h % 12 || 12;

    return `${d}, ${dd}-${m}-${yy} - ${String(h).padStart(2, '0')}:${min}${ampm}`;

  }



  function submitInteractionForm(e) {

    e.preventDefault();



    if (!document.getElementById('fi-cub-id').value) {

    }



    const mode = document.getElementById('fi-is-followup').value;

    };



    // â”€â”€ BOTH NEW AND FOLLOW-UP: CAPTURE NEW ACTION IF SPECIFIED â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    payload.actionRequired = document.getElementById('fi-action-required').value;

      payload.action = document.getElementById('fi-action-desc').value;

    // â”€â”€ NEW INTERACTION â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    if (mode !== 'true' && mode !== 'edit') {



      // Close drawer and show UI immediately (optimistic)

      closeDrawer('interaction-drawer');

      const tempId = `opt_${Date.now()}`;

      const nowStr = _nowDisplayStr();



      // 1. Optimistically insert into interactionsList

      const optimisticInt = {

        interactionId: tempId,

        date: nowStr + ' âœŽ',  // trailing pencil = unconfirmed

        cubId: payload.cubId,

        cubName: `${payload.cubFirstName} ${payload.cubLastName}`,

        parentFirstName: payload.parentFirstName,

        parentLastName: payload.parentLastName,

        parentName: `${payload.parentFirstName} ${payload.parentLastName}`,

        handledBy: payload.handledBy,

        type: payload.type,

        status: payload.status,

        purpose: payload.purpose,

        _pending: true,

      };

      // Determine bucket: is this cub owned by this rep?

      const isOwnContact = cubsList.some(c => c.cubId === payload.cubId);

      const loggedByMe = true; // always true — this rep is submitting the form

      Object.assign(optimisticInt, { isOwnContact, loggedByMe });



      interactionsList.unshift(optimisticInt);

      // Mirror into the correct visibility bucket

      if (isOwnContact) myInteractionsList.unshift(optimisticInt);

      else guestInteractionsList.unshift(optimisticInt);



      // 2. Optimistically update cub's last engagement in cubsList

      const cubIdx = cubsList.findIndex(c => c.cubId === payload.cubId);

      const prevCubSnap = cubIdx >= 0 ? { ...cubsList[cubIdx] } : null;

      if (cubIdx >= 0) {

        cubsList[cubIdx].lastEngagementActivity = nowStr;

        cubsList[cubIdx].handledBy = payload.handledBy;

        cubsList[cubIdx].purpose = payload.purpose;

      }



      // 3. Optimistically insert into actionList if action required

      let optimisticAction = null;

      if (payload.actionRequired === 'Yes') {

        optimisticAction = {

          interactionId: tempId,

          cubId: payload.cubId,

          cubFirstName: payload.cubFirstName,

          cubLastName: payload.cubLastName,

          parentFirstName: payload.parentFirstName,

          parentLastName: payload.parentLastName,

          handledBy: payload.handledBy,

          action: payload.action,

          actionDeadline: payload.actionDeadline,

          actionStatus: 'Pending',

          isOverdue: false,

          _pending: true,

        };

        actionList.unshift(optimisticAction);

        if (dashboardData) dashboardData.pendingActionsCount = (dashboardData.pendingActionsCount || 0) + 1;

      }



      // 4. Re-render everything in-memory (instant — no server round-trip)

      _renderAll();

      showToast('info', 'Saving in background...');



      // 5. Fire the actual server call asynchronously (with lock-contention retry)

      scriptRunWithRetry(ctx => {

        ctx

          .withSuccessHandler(resStr => {

            try {

              const res = JSON.parse(resStr);

              if (res.success && res.count > 0) {

                // Confirm: swap tempId with real server ID and real timestamp

                const idx = interactionsList.findIndex(i => i.interactionId === tempId);

                if (idx >= 0) {

                  interactionsList[idx].interactionId = res.interactionId || tempId;

                  interactionsList[idx].date = res.dateTimeStr || nowStr;  // remove pencil

                  delete interactionsList[idx]._pending;

                }

                if (optimisticAction) {

                  const ai = actionList.findIndex(a => a.interactionId === tempId);

                  if (ai >= 0) {

                    actionList[ai].interactionId = res.interactionId || tempId;

                    delete actionList[ai]._pending;

                if (cubIdx >= 0) cubsList[cubIdx].lastEngagementActivity = res.dateTimeStr || nowStr;

                _renderAll();

              } else {

                interactionsList = interactionsList.filter(i => i.interactionId !== tempId);

                myInteractionsList = myInteractionsList.filter(i => i.interactionId !== tempId);

                guestInteractionsList = guestInteractionsList.filter(i => i.interactionId !== tempId);

                if (optimisticAction) actionList = actionList.filter(a => a.interactionId !== tempId);

                if (prevCubSnap && cubIdx >= 0) cubsList[cubIdx] = prevCubSnap;

                if (dashboardData && optimisticAction) dashboardData.pendingActionsCount = Math.max(0, (dashboardData.pendingActionsCount || 1) - 1);

              if (prevCubSnap && cubIdx >= 0) cubsList[cubIdx] = prevCubSnap;

        myInteractionsList = myInteractionsList.filter(i => i.interactionId !== tempId);

        guestInteractionsList = guestInteractionsList.filter(i => i.interactionId !== tempId);

        if (optimisticAction) actionList = actionList.filter(a => a.interactionId !== tempId);

        if (dashboardData && optimisticAction) dashboardData.pendingActionsCount = Math.max(0, (dashboardData.pendingActionsCount || 1) - 1);

        _renderAll();

        handleApiError(err);

      });



      return; // Done — drawer already closed, tables already updated

    // â”€â”€ ACTION FOLLOW-UP â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

      const newStatus = document.getElementById('fi-action-completion-status').value;

      const newDeadline = '';

      // If follow-up also creates a NEW action, push it optimistically

        actionList = prevActions;

        interactionsList = prevInteractions;

        myInteractionsList = prevMyInteractions;

        guestInteractionsList = prevGuestInteractions;

        _renderAll();

        handleApiError(err);

      const prevGuestInteractions = [...guestInteractionsList];

      const editIdx = interactionsList.findIndex(i => i.interactionId === intId);

  function loadHandoverNotes() {

    const token = sessionStorage.getItem('cero_token');

    if (!token) return;

    const tbody = document.getElementById('handover-tbody');
    if (tbody) tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:32px; color:var(--text-3);">Loading notes...</td></tr>`;

    google.script.run.withSuccessHandler(resStr => {

      try {

        const res = JSON.parse(resStr);

        if (res.success) {

          handoverNotesList = res.notes || [];

          _populateHandoverRepFilter();

          // Default: show all reps — no auto-selection of current rep

          filterHandoverNotes();

        }

      } catch (e) {

        console.error("Error parsing handover notes", e);

      }

    }).getHandoverNotes(token);

  }



  function _populateHandoverRepFilter() {

    const select = document.getElementById('hn-filter-rep');

    if (!select) return;

    const owners = [...new Set(handoverNotesList.map(n => n.loggedBy).filter(Boolean))].sort();

    const currentVal = select.value;

    select.innerHTML = '<option value="">All CER Reps</option>';

    owners.forEach(name => {

      const opt = document.createElement('option');

      opt.value = name;

      opt.textContent = name;

      select.appendChild(opt);

    });

    if (currentVal) select.value = currentVal;

  }



  function filterHandoverNotes() {

    const q = (document.getElementById('hn-search').value || '').toLowerCase();

    const rep = document.getElementById('hn-filter-rep').value || '';



    let filtered = handoverNotesList.filter(n => {

      if (rep && n.loggedBy !== rep) return false;

      if (q) {

        const match = (n.summary || '').toLowerCase().includes(q) ||

          (n.pendingIssues || '').toLowerCase().includes(q) ||

          (n.date || '').toLowerCase().includes(q) ||

          (n.loggedBy || '').toLowerCase().includes(q);

        if (!match) return false;

      }

      return true;

    });



    renderHandoverNotesTable(filtered);

  }



  function renderHandoverNotesTable(list) {

    const tbody = document.getElementById('handover-tbody');

    if (!tbody) return;

    document.getElementById('hn-count').textContent = `${list.length} Note${list.length !== 1 ? 's' : ''}`;



    paginateAndRender('handover', list, (pageData) => {

      tbody.innerHTML = '';

      if (pageData.length === 0) {

        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:48px; color:var(--text-3);">No handover notes found.</td></tr>`;

        return;

      }



      pageData.forEach(note => {

        const tr = document.createElement('tr');

        tr.style.cursor = 'pointer';

        tr.onclick = () => openHandoverDrawer(JSON.stringify(note).replace(/'/g, "&#39;"));



        let summarySnippet = note.summary || '';

        if (summarySnippet.length > 100) summarySnippet = summarySnippet.substring(0, 100) + '...';



        tr.innerHTML = `

        <td style="font-weight:500;">${note.date}</td>

        <td><span style="display:inline-flex; align-items:center; gap:4px; background:var(--bg-2); color:var(--text-2); border-radius:20px; padding:2px 10px; font-size:11px; font-weight:600;">${note.loggedBy}</span></td>

        <td style="color:var(--text-2);">${summarySnippet}</td>

      `;

        tbody.appendChild(tr);

      });

    });

  }



  function openHandoverDrawer(noteStr) {

    const form = document.getElementById('handover-form');

    form.reset();

    document.getElementById('hn-btn-save').disabled = false;



    const drawer = document.getElementById('handover-drawer');

    const overlay = document.getElementById('handover-drawer-overlay');



    if (noteStr) {

      // View/Edit mode

      const note = JSON.parse(noteStr);

      document.getElementById('hn-id').value = note.noteId;

      document.getElementById('hn-mode').value = 'view';

      document.getElementById('hn-drawer-title').textContent = 'Handover Note Details';



      document.getElementById('hn-summary').value = note.summary || '';

      document.getElementById('hn-pending').value = note.pendingIssues || '';



      // Metadata

      document.getElementById('hn-view-meta').style.display = 'block';

      document.getElementById('hn-view-logged-by').textContent = note.loggedBy;

      document.getElementById('hn-view-date').textContent = note.date;



      // Make fields readonly initially

      document.getElementById('hn-summary').readOnly = true;

      document.getElementById('hn-pending').readOnly = true;



      document.getElementById('hn-btn-save').style.display = 'none';



      // Show edit button if it belongs to logged in user

      const loggedByVal = (session.name || session.email).toLowerCase();

      if (note.loggedBy.toLowerCase() === loggedByVal) {

        document.getElementById('hn-btn-edit').style.display = 'block';

      } else {

        document.getElementById('hn-btn-edit').style.display = 'none';

      }



    } else {

      // Create mode

      document.getElementById('hn-id').value = '';

      document.getElementById('hn-mode').value = 'create';

      document.getElementById('hn-drawer-title').textContent = 'Log Handover Note';

      document.getElementById('hn-view-meta').style.display = 'none';



      document.getElementById('hn-summary').readOnly = false;

      document.getElementById('hn-pending').readOnly = false;



      document.getElementById('hn-btn-save').style.display = 'block';

      document.getElementById('hn-btn-save').textContent = 'Save Note';

      document.getElementById('hn-btn-edit').style.display = 'none';

    }



    drawer.classList.add('active');

    overlay.classList.add('active');

  }



  function closeHandoverDrawer() {

    document.getElementById('handover-drawer').classList.remove('active');

    document.getElementById('handover-drawer-overlay').classList.remove('active');

  function switchHandoverToEdit() {

    document.getElementById('hn-mode').value = 'edit';

  function submitHandoverForm(e) {

    e.preventDefault();

    const btn = document.getElementById('hn-btn-save');

    btn.disabled = true;

    btn.textContent = 'Saving...';



    const payload = {

      noteId: document.getElementById('hn-id').value,

      summary: document.getElementById('hn-summary').value,

      pendingIssues: document.getElementById('hn-pending').value

    };



    google.script.run

      .withSuccessHandler(resStr => {

        btn.disabled = false;

        try {

          const res = JSON.parse(resStr);

          if (res.success) {

            showToast('success', payload.noteId ? 'Note updated successfully.' : 'Note created successfully.');

            closeHandoverDrawer();



            // Optimistic UI update

            if (payload.noteId) {

              const idx = handoverNotesList.findIndex(n => n.noteId === payload.noteId);

              if (idx >= 0) {

                handoverNotesList[idx].summary = payload.summary;

                handoverNotesList[idx].pendingIssues = payload.pendingIssues;

              }

            } else {

              handoverNotesList.unshift({

                noteId: res.noteId,

                date: res.date,

                dateSortKey: new Date().getTime(),

                loggedBy: res.loggedBy,

                summary: payload.summary,

                pendingIssues: payload.pendingIssues

              });

            }

            filterHandoverNotes();

          } else {

            btn.textContent = payload.noteId ? 'Update Note' : 'Save Note';

            showToast('error', res.error || 'Failed to save note.');

          }

        } catch (err) {

          btn.textContent = payload.noteId ? 'Update Note' : 'Save Note';

          showToast('error', 'Error parsing response.');

        }

      })

      .withFailureHandler(err => {

        btn.disabled = false;

        btn.textContent = payload.noteId ? 'Update Note' : 'Save Note';

        handleApiError(err);

      })

      .submitHandoverNote(session.token, payload);

  }

  function saveOriJourney() {
    const cubId = document.getElementById('ori-journey-cub-id').value;
    if (!cubId) return;

    const B = {};
    ['BOOKED', 'ATTENDED', 'FIRST_WIN', 'RC_SELECTED'].forEach(k => {
      const stsEl = document.getElementById(`ori-journey-sts-${k}`);
      const fbEl  = document.getElementById(`ori-journey-fb-${k}`);
      if (stsEl) {
        B[k] = { status: stsEl.value };
        if (fbEl) B[k].feedback = fbEl.value;
      }
    });

    const btn = document.getElementById('btn-ori-journey-save');
    const sts = document.getElementById('ori-journey-save-status');
    btn.innerHTML = '<i data-lucide="loader" class="spin"></i> Saving...';
    btn.disabled = true;
    sts.innerHTML = '';
    lucide.createIcons();

    // Optimistic: apply journey changes in-memory immediately
    if (_oriData && _oriData.trackerRows) {
      const tr = _oriData.trackerRows.find(r => r.cubId === cubId);
      if (tr) {
        if (B.FIRST_WIN && B.FIRST_WIN.status === 'Yes')  { tr.stage = 'Completed'; tr.stageStatus = B.FIRST_WIN.status; tr.nextStage = ''; }
        else if (B.RC_SELECTED && B.RC_SELECTED.status === 'Completed')  { tr.stage = 'RC Selected'; tr.stageStatus = B.RC_SELECTED.status; tr.nextStage = 'First Win Sent'; }
        else if (B.ATTENDED && B.ATTENDED.status === 'Present')  { tr.stage = 'Attended'; tr.stageStatus = 'Present'; tr.nextStage = 'RC Selected'; }
        else if (B.BOOKED && B.BOOKED.status)        { tr.stage = 'Booked'; tr.stageStatus = B.BOOKED.status; tr.nextStage = 'Attended'; }
        tr.lastUpdatedBy = (session && session.name) || 'You';
      }
      _renderOriPage();
    }

    closeOriJourneyDrawer();
    showToast('info', 'Saving journey in background...');

    scriptRunWithRetry(ctx => {
      ctx
        .withSuccessHandler(resStr => {
          btn.innerHTML = 'Save Changes';
          btn.disabled = false;
          try {
            const res = JSON.parse(resStr);
            if (res.success) {
              showToast('success', 'Journey updated ✓');
              // Optimistically sync cubsList so the directory/Cubs table update without loadData()
              let newStage = '', newStageStatus = '', newNextStage = '';
              if (B.FIRST_WIN && B.FIRST_WIN.status === 'Yes') { newStage = 'Completed'; newStageStatus = B.FIRST_WIN.status; newNextStage = ''; }
              else if (B.RC_SELECTED && B.RC_SELECTED.status === 'Completed') { newStage = 'RC Selected'; newStageStatus = B.RC_SELECTED.status; newNextStage = 'First Win Sent'; }
              else if (B.ATTENDED && B.ATTENDED.status === 'Present') { newStage = 'Attended'; newStageStatus = 'Present'; newNextStage = 'RC Selected'; }
              else if (B.BOOKED && B.BOOKED.status) { newStage = 'Booked'; newStageStatus = B.BOOKED.status; newNextStage = 'Attended'; }
              else if (B.BOOKED && B.BOOKED.status) { newStage = 'Booked'; newStageStatus = B.BOOKED.status; newNextStage = 'Attended'; }
              if (newStage) _applyRcOriMutation(cubId, { orientationStage: newStage, orientationStageStatus: newStageStatus, orientationNextStage: newNextStage });
              // Then do a quiet background refresh of the Ori page to get server-authoritative data
              setTimeout(() => loadOrientationPage(true), 800);
            } else {
              sts.innerHTML = `<span style="color:var(--red);">Error: ${res.error}</span>`;
              loadOrientationPage(true); // Reload to reset any bad optimistic state
            }
          } catch (e) {
            sts.innerHTML = '<span style="color:var(--red);">Unexpected response</span>';
          }
        })
        .withFailureHandler(err => {
          btn.innerHTML = 'Save Changes';
          btn.disabled = false;
          sts.innerHTML = `<span style="color:var(--red);">${err.message}</span>`;
          loadOrientationPage(true);
        })
        .updateCubJourney(session.token, { cubId, blocks: B });
    }).catch(err => {
      btn.innerHTML = 'Save Changes';
      btn.disabled = false;
      handleApiError(err);
      loadOrientationPage(true);
    });
  }


  /**
   * Mutates cubsList + dashboardData in-memory after an RC or Ori write action,
   * then re-renders the affected dashboard widgets. Mirrors the pattern used by
   * Log Interaction — no server round-trip, no loadData() needed.
   *
   * @param {string} cubId  - The cub being updated
   * @param {Object} patch  - Fields to apply. Supported keys:
   *   rcSession, rcCategory, noPresent, lastAttendanceDate  (RC fields on cubsList)
   *   orientationStage, orientationStageStatus, orientationNextStage  (Ori fields)
   *   pendingCountDelta  (number) — positive to increment, negative to decrement the overall pending count
   *   rcPendingDelta     (number) — for the RC pending badge
   *   oriPendingDelta    (number) — for the Ori pending badge
   */
  function _applyRcOriMutation(cubId, patch = {}) {
    // 1. Mutate cubsList entry
    if (cubId && cubsList) {
      const cub = cubsList.find(c => c.cubId === cubId);
      if (cub) {
        if (patch.rcSession        !== undefined) { if (!cub.readingCircle) cub.readingCircle = {}; cub.readingCircle.selectedSession = patch.rcSession; }
        if (patch.rcCategory       !== undefined) { cub.readingCircleCategory = patch.rcCategory; if (!cub.readingCircle) cub.readingCircle = {}; cub.readingCircle.rcCategory = patch.rcCategory; }
        if (patch.noPresent        !== undefined) { cub.noPresent = patch.noPresent; }
        if (patch.lastAttendanceDate !== undefined) { cub.lastAttendanceDate = patch.lastAttendanceDate; }
        if (patch.orientationStage       !== undefined) { cub.orientationStage       = patch.orientationStage; }
        if (patch.orientationStageStatus !== undefined) { cub.orientationStageStatus = patch.orientationStageStatus; }
        if (patch.orientationNextStage   !== undefined) { cub.orientationNextStage   = patch.orientationNextStage; }
      }
    }

    // 2. Mutate dashboardData pending counts
    if (dashboardData) {
      if (patch.pendingCountDelta) dashboardData.pendingActionsCount = Math.max(0, (dashboardData.pendingActionsCount || 0) + patch.pendingCountDelta);
    }

    // 3. Re-render dashboard stat cards (uses dashboardData) 
    renderDashboard();

    // 4. Re-render Cubs table so the orientation/RC columns are fresh
    filterCubs();
  }

  // READING CIRCLE PAGE
  // ═══════════════════════════════════════════════════════════════

  let _rcData = null; let _rcDataTs = 0;

  function loadReadingCirclePage(force = false) {
    if (_rcData) {
      _renderRCPage();
    } else {
      ['rc-stat-total', 'rc-stat-pending', 'rc-stat-streaks', 'rc-stat-avg'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '—';
      });
      document.getElementById('rc-pending-tbody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-3);padding:24px;">Loading...</td></tr>';
      document.getElementById('rc-roster-tbody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-3);padding:24px;">Loading...</td></tr>';
    }

    if (!force && _rcData && (Date.now() - _rcDataTs < 300000)) {
      return;
    }

    google.script.run
      .withSuccessHandler(resStr => {
        try {
          _rcData = JSON.parse(resStr);
          _rcDataTs = Date.now();
          _renderRCPage();
        } catch (e) {
          document.getElementById('rc-pending-tbody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--red);padding:24px;">Error loading data.</td></tr>';
        }
      })
      .withFailureHandler(err => {
        document.getElementById('rc-pending-tbody').innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--red);padding:24px;">${err.message || 'Failed to load.'}</td></tr>`;
      })
      .getRCPageData(session.token);
  }

  function _renderRCPage() {
    if (!_rcData) return;
    const pending = _rcData.pendingRows || [];
    const roster = _rcData.rosterRows || [];

    const pendingCount = pending.filter(r => (r.status || '').toLowerCase() === 'pending').length;
    const streakCount = roster.filter(r => parseInt(r.currentStreak) > 0).length;
    const totalPresent = roster.reduce((s, r) => s + (parseInt(r.noPresent) || 0), 0);
    const avgAttendance = roster.length > 0 ? (totalPresent / roster.length).toFixed(1) : '—';

    document.getElementById('rc-stat-total').textContent = roster.length;
    document.getElementById('rc-stat-pending').textContent = pendingCount;
    document.getElementById('rc-stat-streaks').textContent = streakCount;
    document.getElementById('rc-stat-avg').textContent = avgAttendance;

    const badge = document.getElementById('rc-pending-badge');
    if (badge) { badge.textContent = pendingCount; badge.style.display = pendingCount > 0 ? '' : 'none'; }

    // Populate session/category dropdowns from data
    const sessions = [...new Set(roster.map(r => r.session).filter(Boolean))];
    const categories = [...new Set(roster.map(r => r.rcCategory).filter(Boolean))];
    const sessEl = document.getElementById('rc-roster-session-filter');
    const catEl = document.getElementById('rc-roster-category-filter');
    sessEl.innerHTML = '<option value="">All Sessions</option>' + sessions.map(s => `<option value="${s}">${s}</option>`).join('');
    catEl.innerHTML = '<option value="">All Categories</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');

    filterRCPending();
    filterRCRoster();
    lucide.createIcons();
  }

  function filterRCPending() {
    if (!_rcData) return;
    const q = (document.getElementById('rc-pending-search').value || '').toLowerCase();
    const status = (document.getElementById('rc-pending-status-filter').value || '').toLowerCase();
    const rows = (_rcData.pendingRows || []).filter(r => {
      if (status && (r.status || '').toLowerCase() !== status) return false;
      const hay = `${r.parentName} ${r.parentPhone} ${r.cubName} ${r.session} ${r.grade} ${r.matchedCubId}`.toLowerCase();
      return !q || hay.includes(q);
    });
    document.getElementById('rc-pending-count').textContent = `${rows.length} Signup${rows.length !== 1 ? 's' : ''}`;
    paginateAndRender('rc-pending', rows, _renderRCPendingRows);

  function openPendingDrawer(type, pendingId, matchedId) {
    const data = type === 'orientation' ? _oriData : _rcData;
    if (!data) {
      showToast('warning', `${type.charAt(0).toUpperCase() + type.slice(1)} data not loaded yet. Please wait...`);
      if (type === 'orientation') loadOrientationPage(true);
      else loadReadingCirclePage(true);
      return;
    }
    
    try {
      let rowData = null;
      if (type === 'orientation' && _oriData && _oriData.pendingRows) {
        rowData = _oriData.pendingRows.find(r => r.pendingId === pendingId);
      } else if (type === 'rc' && _rcData && _rcData.pendingRows) {
        rowData = _rcData.pendingRows.find(r => r.pendingId === pendingId);
      }
      if (!rowData) {
        showToast('error', 'Pending record not found.');
        return;
      }

      // Helper to safely get element with logging
      const getEl = (id) => {
        const el = document.getElementById(id);
        if (!el) console.error(`[openPendingDrawer] Element not found: #${id}`);
        return el;
      };

      const typeEl = getEl('pending-drawer-type');
      const idEl = getEl('pending-drawer-id');
      const sessionEl = getEl('pending-drawer-session');
      const resultDiv = getEl('pending-drawer-result');
      const acceptBtn = getEl('btn-pending-accept');
      const cubIdInput = getEl('pending-drawer-cubid');
      const overlay = getEl('pending-drawer-overlay');
      const drawer = getEl('pending-drawer');

      if (!typeEl || !idEl || !sessionEl || !resultDiv || !acceptBtn || !cubIdInput || !overlay || !drawer) {
        showToast('error', 'Drawer elements missing from DOM. Please refresh the page.');
        return;
      }

      typeEl.value = type;
      idEl.value = pendingId;
      sessionEl.value = rowData.session || '';

      resultDiv.innerHTML = '';
      acceptBtn.disabled = true;
      acceptBtn.dataset.cubId = '';

      cubIdInput.value = matchedId || '';

      overlay.classList.add('active');
      drawer.classList.add('active');

      if (matchedId) {
        searchPendingDrawerCub();
      }
    } catch (e) {
      console.error('openPendingDrawer error:', e);
      showToast('error', 'Failed to open drawer: ' + e.message);
    }
  }

    const prevRcData  = _rcData  ? JSON.parse(JSON.stringify(_rcData))  : null;
    if (type === 'orientation' && _oriData) {
      _oriData.pendingRows = (_oriData.pendingRows || []).filter(r => r.pendingId !== pendingId);
      _renderOriPage();
    } else if (_rcData) {
      _rcData.pendingRows = (_rcData.pendingRows || []).filter(r => r.pendingId !== pendingId);
      _renderRCPage();
    }
    closePendingDrawer();
    showToast('info', 'Rejecting signup...');

    scriptRunWithRetry(ctx => {
      ctx
        .withSuccessHandler(resStr => {
          try {
            const res = JSON.parse(resStr);
            if (res.success) {
              showToast('info', 'Signup rejected and deleted.');
              // Optimistically re-render the dashboard without a full loadData()
              _applyRcOriMutation(null, {});
              if (type === 'orientation') loadOrientationPage(true);
              else loadReadingCirclePage(true);
            } else {
              if (type === 'orientation' && prevOriData) { _oriData = prevOriData; _renderOriPage(); }
              else if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
              showToast('error', res.error || 'Reject failed.');
            }
          } catch (e) {
            if (type === 'orientation' && prevOriData) { _oriData = prevOriData; _renderOriPage(); }
            else if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
            showToast('error', 'Unexpected error.');
          }
        })
        .withFailureHandler(err => {
          if (type === 'orientation' && prevOriData) { _oriData = prevOriData; _renderOriPage(); }
          else if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
          showToast('error', err.message || 'Reject failed.');
        })
        .rejectPendingSignup(session.token, payload);
    }).catch(err => {
      if (type === 'orientation' && prevOriData) { _oriData = prevOriData; _renderOriPage(); }
      else if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
      handleApiError(err);
    });
  }
  // ═══════════════════════════════════════════════════════════════
  // RC ATTENDANCE BATCH
  // ═══════════════════════════════════════════════════════════════
  function openRCAttendanceDrawer() {
    // Ensure data is loaded
    if (!_rcData || !_rcData.rosterRows) {
      showToast('warning', 'Loading RC data... Please wait a moment.');
      loadReadingCirclePage();
      return;
    }
    
    try {
      const sel = document.getElementById('rc-attendance-session');
      if (!sel) {
        showToast('error', 'Drawer element not found. Please refresh the page.');
        return;
      }
      
      sel.innerHTML = '<option value="">-- Choose Session --</option>';
      if (window.CONFIG && window.CONFIG.rcSessions) {
        window.CONFIG.rcSessions.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s; opt.textContent = s;
          sel.appendChild(opt);
        });
      }
      
      // Set default date to today
      const dateInput = document.getElementById('rc-attendance-date');
      if (dateInput && !dateInput.value) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;
      }
      
      document.getElementById('rc-attendance-list').innerHTML = '';
      document.getElementById('btn-save-rc-attendance').disabled = true;
      
      const overlay = document.getElementById('rc-attendance-drawer-overlay');
      const drawer = document.getElementById('rc-attendance-drawer');
      if (overlay && drawer) {
        overlay.classList.add('active');
        drawer.classList.add('active');
      } else {
        showToast('error', 'Drawer elements not found. Please refresh the page.');
      }
    } catch (e) {
      console.error('openRCAttendanceDrawer error:', e);
      showToast('error', 'Failed to open drawer: ' + e.message);
    }
  }

  function closeRCAttendanceDrawer() {
    document.getElementById('rc-attendance-drawer-overlay').classList.remove('active');
    document.getElementById('rc-attendance-drawer').classList.remove('active');
  }

  function loadRCAttendanceCubs() {
    const rcSession = document.getElementById('rc-attendance-session').value;
    if (!session) return;
    if (!rcSession) {
      showToast('warning', 'Please select a session first.');
      return;
    }

    const container = document.getElementById('rc-attendance-list');
    container.innerHTML = '<div style="color:var(--text-3);font-size:13px;"><i data-lucide="loader" class="spin"></i> Loading cubs...</div>';
    lucide.createIcons();
    
    // Use _rcData.rosterRows since it contains the actual RC session for each cub
    if (!_rcData || !_rcData.rosterRows || _rcData.rosterRows.length === 0) {
      container.innerHTML = '<div style="color:red;font-size:13px;">Error: RC Roster data not loaded.</div>';
      return;
    }
    
    const rcCubs = _rcData.rosterRows.filter(c => c.session === rcSession);
    
    if (rcCubs.length === 0) {
      container.innerHTML = '<div style="color:var(--text-3);font-size:13px;">No cubs found for this session.</div>';
      document.getElementById('btn-save-rc-attendance').disabled = true;
      return;
    }
    
    // Sort alphabetically by first name
    rcCubs.sort((a,b) => (a.cubFirstName || '').localeCompare(b.cubFirstName || ''));
    
    let html = '';
    rcCubs.forEach((c) => {
      const name = (c.cubFirstName || '') + ' ' + (c.cubLastName || '');
      html += `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; border:1px solid var(--border); border-radius:6px; background:var(--bg-1);">
          <div>
            <div style="font-weight:500; font-size:13px; color:var(--text-1);">${name}</div>
            <div style="font-size:11px; color:var(--text-3);">${c.cubId}</div>
          </div>
          <div style="display:flex; gap:16px;">
            <label style="display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer;">
              <input type="radio" name="att-${c.cubId}" value="Present"> Present
            </label>
            <label style="display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer;">
              <input type="radio" name="att-${c.cubId}" value="Absent" checked> Absent
            </label>
          </div>
        </div>
      `;
    });
    
    container.innerHTML = html;
    document.getElementById('btn-save-rc-attendance').disabled = false;
  }

  function _formatDateForRC(dateStr) {
    if (!dateStr) return '';
    const dObj = new Date(dateStr);
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const d = String(dObj.getDate()).padStart(2, '0');
    const m = months[dObj.getMonth()];
    const y = String(dObj.getFullYear()).slice(-2);
    return d + '-' + m + '-' + y;
  }

  function submitRCAttendanceBatch() {
    const rcSession = document.getElementById('rc-attendance-session').value;
    const dateInput = document.getElementById('rc-attendance-date').value;
    if (!rcSession || !dateInput) {
      showToast('warning', "Please select a session and date.");
      return;
    }
    
    const dateStrFormatted = _formatDateForRC(dateInput);
    const container = document.getElementById('rc-attendance-list');
    const attendanceMap = {};
    const rows = container.querySelectorAll('div[style*="border:"]');
    
    rows.forEach(r => {
      const cubIdDiv = r.querySelector('div[style*="font-size:11px"]');
      if (cubIdDiv) {
        const cubId = cubIdDiv.textContent.trim();
        const checkedRadio = r.querySelector(`input[name="att-${cubId}"]:checked`);
        attendanceMap[cubId] = checkedRadio ? checkedRadio.value : 'Absent';
      }
    });

    // Snapshot for rollback
    const prevRcData = _rcData ? JSON.parse(JSON.stringify(_rcData)) : null;

    // Optimistic: update noPresent and lastAttendance in local _rcData immediately
    if (_rcData && _rcData.rosterRows) {
      _rcData.rosterRows.forEach(r => {
        if (attendanceMap.hasOwnProperty(r.cubId)) {
          const status = attendanceMap[r.cubId];
          if (status === 'Present') {
            r.noPresent = (parseInt(r.noPresent) || 0) + 1;
            r.lastAttendanceDate = dateStrFormatted;
          }
        }
      });
    }

    // Close drawer and re-render immediately
    closeRCAttendanceDrawer();
    if (_rcData) _renderRCPage();
    showToast('info', 'Saving attendance in background...');
    
    scriptRunWithRetry(ctx => {
      ctx
        .withSuccessHandler(res => {
          const r = JSON.parse(res);
          if (r.success) {
            showToast('success', `Attendance saved ✓ (${r.presentCount || 0} present)`);
            // Optimistically sync cubsList (noPresent, lastAttendanceDate) without loadData()
            Object.keys(attendanceMap).forEach(cubId => {
              if (attendanceMap[cubId] === 'Present') {
                const cub = cubsList ? cubsList.find(c => c.cubId === cubId) : null;
                if (cub) {
                  const newCount = (parseInt(cub.noPresent) || 0) + 1;
                  _applyRcOriMutation(cubId, { noPresent: newCount, lastAttendanceDate: dateStrFormatted });
                }
              }
            });
            // Quiet background refresh for authoritative counts
            loadReadingCirclePage(true);
          } else {
            // Rollback
            if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
            showToast('error', 'Error: ' + r.error);
          }
        })
        .withFailureHandler(err => {
          if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
          showToast('error', 'System Error saving attendance');
        })
        .submitRCAttendance(session.token, { session: rcSession, dateStr: dateStrFormatted, attendanceMap: attendanceMap });
    }).catch(err => {
      if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
      handleApiError(err);
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // RC CHANGE SESSION
  // ═══════════════════════════════════════════════════════════════
  function openRCChangeSessionDrawer() {
    // Ensure data is loaded
    if (!window.CUBS || window.CUBS.length === 0) {
      showToast('warning', 'Loading cub data... Please wait a moment.');
      loadData();
      return;
    }
    
    try {
      document.getElementById('rc-change-cubid').value = '';
      document.getElementById('rc-change-result').innerHTML = '';
      document.getElementById('btn-save-rc-change').disabled = true;
      
      const overlay = document.getElementById('rc-change-session-drawer-overlay');
      const drawer = document.getElementById('rc-change-session-drawer');
      if (overlay && drawer) {
        overlay.classList.add('active');
        drawer.classList.add('active');
      } else {
        showToast('error', 'Drawer elements not found. Please refresh the page.');
      }
    } catch (e) {
      console.error('openRCChangeSessionDrawer error:', e);
      showToast('error', 'Failed to open drawer: ' + e.message);
    }
  }

  function closeRCChangeSessionDrawer() {
    document.getElementById('rc-change-session-drawer-overlay').classList.remove('active');
    document.getElementById('rc-change-session-drawer').classList.remove('active');
  }

  function searchRCChangeCub() {
    const cubId = document.getElementById('rc-change-cubid').value.trim();
    if (!cubId) return;
    
    const btn = document.querySelector('#rc-change-session-drawer .btn-primary');
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '<i data-lucide="loader" class="spin"></i>';
    btn.disabled = true;
    lucide.createIcons();
    
    const cub = (window.CUBS || []).find(c => String(c.cubId).trim().toLowerCase() === cubId.toLowerCase());
    
    btn.innerHTML = oldHtml;
    btn.disabled = false;
    
    const res = document.getElementById('rc-change-result');
    if (!cub) {
      res.innerHTML = `<div style="padding:12px; border-radius:6px; background:var(--bg-red-dim); color:var(--text-red); font-size:13px;">Cub not found in directory.</div>`;
      document.getElementById('btn-save-rc-change').disabled = true;
      return;
    }
    
    const currSession = (cub.readingCircle && cub.readingCircle.selectedSession) ? cub.readingCircle.selectedSession : 'None';
    const rcCategory = (cub.readingCircle && cub.readingCircle.rcCategory) ? cub.readingCircle.rcCategory : 'Unassigned';
    
    let opts = '<option value="">-- Choose New Session --</option>';
    if (window.CONFIG && window.CONFIG.rcSessions) {
      window.CONFIG.rcSessions.forEach(s => {
        opts += `<option value="${s}">${s}</option>`;
      });
    }
    
    res.innerHTML = `
      <div style="border:1px solid var(--border); border-radius:6px; padding:16px; background:var(--bg-1);">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
          <div style="width:40px; height:40px; border-radius:50%; background:var(--blue); color:white; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px;">
             ${cub.cubFirstName ? cub.cubFirstName.charAt(0).toUpperCase() : '?'}
          </div>
          <div>
            <div style="font-weight:600; font-size:15px; color:var(--text-1);">${cub.cubFirstName || ''} ${cub.cubLastName || ''}</div>
            <div style="font-size:13px; color:var(--text-3);">Current Session: <span style="font-weight:500; color:var(--text-1);">${currSession}</span></div>
            <div style="font-size:13px; color:var(--text-3);">Category: <span style="font-weight:500; color:var(--text-1);">${rcCategory}</span></div>
          </div>
        </div>
        <div class="form-group" style="margin-top:16px; margin-bottom:0;">
          <label>New Session</label>
          <select id="rc-change-new-session" class="form-input">${opts}</select>
        </div>
      </div>
    `;
    
    document.getElementById('btn-save-rc-change').dataset.cubid = cub.cubId;
    document.getElementById('btn-save-rc-change').disabled = false;
  }

  function submitRCChangeSession() {
    const newSession = document.getElementById('rc-change-new-session').value;
    if (!newSession) {
      showToast('warning', "Please select a new session.");
      return;
    }
    const cubId = document.getElementById('btn-save-rc-change').dataset.cubid;
    
    // Snapshot for rollback
    const prevRcData = _rcData ? JSON.parse(JSON.stringify(_rcData)) : null;

    // Optimistic: update session in local _rcData immediately
    if (_rcData && _rcData.rosterRows) {
      const rr = _rcData.rosterRows.find(r => r.cubId === cubId);
      if (rr) { rr.session = newSession; }
    }
    if (window.CUBS) {
      const cub = window.CUBS.find(c => c.cubId === cubId);
      if (cub && cub.readingCircle) cub.readingCircle.selectedSession = newSession;
    }
    closeRCChangeSessionDrawer();
    if (_rcData) _renderRCPage();
    showToast('info', 'Changing session in background...');

    scriptRunWithRetry(ctx => {
      ctx
        .withSuccessHandler(res => {
          const r = JSON.parse(res);
          if (r.success) {
            // Optimistically sync cubsList (rcSession + rcCategory) without loadData()
            _applyRcOriMutation(cubId, {
              rcSession: newSession,
              rcCategory: r.newCategory || undefined
            });
            // Also update the rcCategory in _rcData if returned
            if (r.newCategory && _rcData && _rcData.rosterRows) {
              const rr = _rcData.rosterRows.find(row => row.cubId === cubId);
              if (rr) { rr.rcCategory = r.newCategory; _renderRCPage(); }
            }
            showToast('success', 'Session changed ✓');
            // Quiet background refresh
            loadReadingCirclePage(true);
          } else {
            if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
            showToast('error', 'Error: ' + r.error);
          }
        })
        .withFailureHandler(err => {
          if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
          showToast('error', 'System Error changing session');
        })
        .changeCubRCSession(session.token, { cubId: cubId, newSession: newSession });
    }).catch(err => {
      if (prevRcData) { _rcData = prevRcData; _renderRCPage(); }
      handleApiError(err);
    });
  }
  // ═══════════════════════════════════════════════════════════════
  // MULTIPLAYER BACKGROUND SYNC
  // ═══════════════════════════════════════════════════════════════
  window.localDataVersions = { dashboard: 0, ori_rc: 0 };
  let _syncIntervalId = null;

  function startBackgroundSync() {
    if (_syncIntervalId) clearInterval(_syncIntervalId);
    
    // Poll every 12 seconds
    _syncIntervalId = setInterval(() => {
      if (!session || !session.token) return;

      google.script.run
        .withSuccessHandler(resStr => {
          try {
            const v = JSON.parse(resStr);
            if (v.error) return;
            
            // First time init
            if (window.localDataVersions.dashboard === 0) {
              window.localDataVersions.dashboard = v.dashboard;
              window.localDataVersions.ori_rc = v.ori_rc;
              return;
            }

            // Check Dashboard (Interactions, Add Cub, etc)
            if (v.dashboard > window.localDataVersions.dashboard) {
              window.localDataVersions.dashboard = v.dashboard;
              console.log('Background Sync: Dashboard data changed. Fetching updates...');
              loadData(); // Quiet, doesn't show splash since splash is only on initial load
            }

            // Check RC / Orientation
            if (v.ori_rc > window.localDataVersions.ori_rc) {
              window.localDataVersions.ori_rc = v.ori_rc;
              console.log('Background Sync: RC/Orientation changed. Fetching updates...');
              if (typeof _oriData !== 'undefined' && _oriData) loadOrientationPage(true);
              if (typeof _rcData !== 'undefined' && _rcData) loadReadingCirclePage(true);
            }
          } catch (e) {}
        })
        .withFailureHandler(() => {})
        .checkDataVersions(session.token);
    }, 12000);
  }
